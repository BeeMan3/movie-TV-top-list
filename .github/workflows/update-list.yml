name: Update Top Movies and Series List

on:
    schedule:
        - cron: "15 6 * * *"
    workflow_dispatch: # Allow manual triggering

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    update-list:
        runs-on: ubuntu-latest
        environment: github-pages

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  python -m playwright install --with-deps chromium

            - name: Fetch latest movies and series
              env:
                  SCRAPER_MAX_MOVIES: ${{ vars.SCRAPER_MAX_MOVIES }}
                  SCRAPER_MAX_TV_SHOWS: ${{ vars.SCRAPER_MAX_TV_SHOWS }}
                  SCRAPER_MAX_TOTAL_ITEMS: ${{ vars.SCRAPER_MAX_TOTAL_ITEMS }}
              run: python fetch_top_list.py

            - name: Create deployment directory
              run: |
                  mkdir -p deploy
                  cp top-list.json deploy/
                  cp top-list-detailed.json deploy/
                  cp templates/index.html deploy/

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: deploy
                  keep_files: false
                  commit_message: "Update top movies and series list"
