name: Update Top Movies and Series List

on:
    schedule:
        - cron: "15 6 * * *"
    workflow_dispatch: # Allow manual triggering

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    update-list:
        runs-on: ubuntu-latest
        environment: github-pages

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Fetch latest movies and series
              env:
                  TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
                  SCRAPER_MAX_MOVIES: ${{ vars.SCRAPER_MAX_MOVIES }}
                  SCRAPER_MAX_TV_SHOWS: ${{ vars.SCRAPER_MAX_TV_SHOWS }}
                  SCRAPER_MAX_TOTAL_ITEMS: ${{ vars.SCRAPER_MAX_TOTAL_ITEMS }}
                  SCRAPER_MIN_YEAR: ${{ vars.SCRAPER_MIN_YEAR }}
              run: python fetch_top_list.py

            - name: Fetch home-released movies and series
              env:
                  TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
                  SCRAPER_MAX_MOVIES: ${{ vars.SCRAPER_MAX_MOVIES }}
                  SCRAPER_MAX_TV_SHOWS: ${{ vars.SCRAPER_MAX_TV_SHOWS }}
                  SCRAPER_MAX_TOTAL_ITEMS: ${{ vars.SCRAPER_MAX_TOTAL_ITEMS }}
                  SCRAPER_MIN_YEAR: ${{ vars.SCRAPER_MIN_YEAR }}
                  SCRAPER_REQUIRE_HOME_RELEASE: "true"
                  SCRAPER_HOME_RELEASE_REGION: "US"
                  SCRAPER_SIMPLE_OUTPUT_FILE: top-list-home-release.json
                  SCRAPER_DETAILED_OUTPUT_FILE: top-list-home-release-detailed.json
              run: python fetch_top_list.py

            - name: Fetch popular home-released movies
              env:
                  TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
                  SCRAPER_MAX_MOVIES: "400"
                  SCRAPER_MIN_YEAR: "1990"
                  SCRAPER_MIN_RATING: "6.0"
                  SCRAPER_POPULAR_MIN_VOTE_COUNT: "300"
                  SCRAPER_HOME_RELEASE_REGION: "US"
                  SCRAPER_SIMPLE_OUTPUT_FILE: top-list-popular-home-release.json
                  SCRAPER_DETAILED_OUTPUT_FILE: top-list-popular-home-release-detailed.json
              run: python fetch_popular_movies.py

            - name: Create deployment directory
              run: |
                mkdir -p deploy

                cp top-list.json deploy/
                cp top-list-detailed.json deploy/
                jq -r '.[].title' top-list.json |
                  awk 'NF && !seen[$0]++' > deploy/top-list.txt

                cp top-list-home-release.json deploy/
                cp top-list-home-release-detailed.json deploy/
                jq -r '.[].title' top-list-home-release.json |
                  awk 'NF && !seen[$0]++' > deploy/top-list-home-release.txt

                cp top-list-popular-home-release.json deploy/
                cp top-list-popular-home-release-detailed.json deploy/
                jq -r '.[].title' top-list-popular-home-release.json |
                  awk 'NF && !seen[$0]++' > deploy/top-list-popular-home-release.txt

                cp templates/index.html deploy/

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                publish_dir: deploy
                keep_files: false
                commit_message: "Update top movies and series list"
